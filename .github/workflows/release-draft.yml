# Collects changes on main into one GitHub Release draft.
# The draft starts as the next patch version. A newer tag name typed into the draft
# (for a minor or major release) is kept. Publishing the draft runs publish.yml.
name: Release draft

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update the release draft
        uses: actions/github-script@v9
        with:
          script: |
            const {default: updateReleaseDraft} = await import('${{ github.workspace }}/.github/scripts/draft.js');
            await updateReleaseDraft({github, context, core, exec});
